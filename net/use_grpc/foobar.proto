syntax = "proto3";

package foobar;

service FoobarService
{
  rpc record_can_location(CabLocationRequest) returns (CabLocationResposne);
  rpc ger_cabs(GetCabRequest) returns (GetCabResposne);

}


message CabLocationRequest
{
  string name = 1;
  Location location = 2;
}

message CabLocationResposne
{
  bool accepted = 1;
  
}


message GetCabRequest
{
  Location location = 1;
}


message GetCabResposne
{
  repeated Cab cabs = 1;
}

message Cab
{
  string name = 1;
  Location location = 2;
}

message Location
{
  float latitude = 1;
  float longitude = 2;
}